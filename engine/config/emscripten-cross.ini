# Meson cross-compilation file: build for WebAssembly with Emscripten.
# Used by engine/scripts/build-glib.sh. emcc etc. must be on PATH
# (engine/scripts/build-glib.sh sources emsdk_env.sh first).

[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
strip = 'emstrip'
# Meson runs small test programs during configure; node runs the .js output.
exe_wrapper = 'node'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
